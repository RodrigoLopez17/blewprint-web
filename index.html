/* Layout: a daily broadside on a blueprint sheet — masthead, today's edition as lead story + side stories + radar, then the archive by date. */
:root{
  --paper:#F4F1E8; --raised:#FFFFFF; --line:#D9D3C4; --ink:#0D1B36; --muted:#4E5A72;
  --plano:#0F2E73; --plano-grid:#2A4C97; --cian:#1846B8; --soplo:#FF5B1F; --soplo-ink:#B93A0B; --blew:#E04812; --on-plano:#F4F1E8; --on-soplo:#0D1B36;
  --font-display:"Space Grotesk",system-ui,sans-serif; --font-serif:"Source Serif 4",Georgia,serif; --font-mono:"IBM Plex Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--paper:#0A1630;--raised:#11234A;--line:#22355E;--ink:#EEF1F6;--muted:#A6B1C7;--plano:#1B3F94;--plano-grid:#2D53A8;--cian:#8DB0FF;--soplo:#FF6E36;--soplo-ink:#FF8A5B;--blew:#FF6E36;color-scheme:dark}}
:root[data-theme="dark"]{--paper:#0A1630;--raised:#11234A;--line:#22355E;--ink:#EEF1F6;--muted:#A6B1C7;--plano:#1B3F94;--plano-grid:#2D53A8;--cian:#8DB0FF;--soplo:#FF6E36;--soplo-ink:#FF8A5B;--blew:#FF6E36;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font:17px/1.65 var(--font-serif)}
a{color:inherit}
.wrap{max-width:1180px;margin:0 auto;padding-inline:20px}
.k{font:500 12px/1.3 var(--font-mono);letter-spacing:.12em;text-transform:uppercase}
.k.sec{color:var(--soplo-ink)}
.k.mut{color:var(--muted)}
h1,h2,h3{font-family:var(--font-display);font-weight:700;line-height:1.1;letter-spacing:-.02em;text-wrap:balance;margin:0}

/* masthead */
.mast{background:var(--plano);color:var(--on-plano);background-image:linear-gradient(var(--plano-grid) 1px,transparent 1px),linear-gradient(90deg,var(--plano-grid) 1px,transparent 1px);background-size:32px 32px;background-position:-1px -1px}
.mast .wrap{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:20px;align-items:end;padding-block:36px 28px}
.mast .logo svg{height:52px;width:auto;display:block}
.mast .logo .print{fill:var(--on-plano)} .mast .logo .blew{fill:var(--soplo)}
.mast .tag{font:500 15px/1.4 var(--font-mono);margin:14px 0 0;color:#C9D3EA}
.mast .side{text-align:right;display:flex;flex-direction:column;gap:6px;align-items:flex-end}
.mast .side a{color:var(--on-plano);text-decoration:none;border-bottom:1px solid var(--soplo)}
.bar{border-bottom:1px solid var(--line)}
.bar .wrap{display:flex;flex-wrap:wrap;gap:10px 20px;align-items:center;padding-block:12px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-right:auto}
.chip{font:500 13px/1 var(--font-display);border:1px solid var(--line);background:var(--raised);color:var(--ink);border-radius:999px;padding:8px 14px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.search{font:15px/1 var(--font-serif);color:var(--ink);background:var(--raised);border:1px solid var(--line);border-radius:4px;padding:9px 12px;width:min(280px,100%)}
.chip:focus-visible,.search:focus-visible,a:focus-visible{outline:2px solid var(--cian);outline-offset:2px}

/* today */
.today{padding-block:40px 16px}
.today .dayhd{display:flex;flex-wrap:wrap;align-items:baseline;gap:8px 16px;margin-bottom:22px}
.today .dayhd h2{font-size:clamp(30px,4.4vw,44px)}
.pill{display:inline-flex;align-items:center;gap:8px;background:var(--soplo);color:var(--on-soplo);border-radius:999px;padding:6px 12px;font:500 12px/1 var(--font-mono);letter-spacing:.12em;text-transform:uppercase}
.pill i{width:7px;height:7px;border-radius:50%;background:var(--on-soplo)}
.grid{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);gap:28px 40px}
.lead{border-top:3px solid var(--ink);padding-top:18px;min-width:0}
.lead h3{font-size:clamp(30px,4vw,46px);line-height:1.04;margin-top:12px}
.lead .dek{font-size:20px;line-height:1.55;margin:16px 0 0;max-width:62ch}
.dato{display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 20px;align-items:baseline;background:var(--plano);color:var(--on-plano);border-radius:8px;padding:18px 22px;margin-top:22px}
.dato .fig{font:500 clamp(30px,4vw,40px)/1 var(--font-mono);color:var(--soplo);white-space:nowrap}
.dato .ctx{font-size:16px;line-height:1.45}
.src{display:inline-block;margin-top:14px}
.src a{color:var(--cian)}
.side-stories{display:flex;flex-direction:column;gap:0;min-width:0}
.story{border-top:1px solid var(--line);padding-block:18px;min-width:0}
.side-stories .story:first-child{border-top:3px solid var(--ink)}
.story h3{font-size:24px;line-height:1.12;margin-top:10px}
.story .dek{font-size:16px;line-height:1.55;margin:10px 0 0;color:var(--ink)}
.story .fig{font:500 22px/1 var(--font-mono);color:var(--soplo-ink);margin-top:12px;display:block}
.radar{margin-top:8px;background:var(--raised);border:1px solid var(--line);border-radius:4px;padding:18px 20px}
.radar h4{margin:0 0 6px;font:700 18px/1.2 var(--font-display)}
.radar ul{margin:0;padding:0;list-style:none}
.radar li{padding:10px 0;border-top:1px solid var(--line);font-size:15px;line-height:1.45}
.radar li:first-child{border-top:0}
.radar li b{font-family:var(--font-display);font-weight:700;display:block}

/* archive */
.archive{padding-block:36px 64px}
.archive > h2{font-size:26px;margin-bottom:6px}
.day{display:grid;grid-template-columns:150px minmax(0,1fr);gap:16px 32px;border-top:1px solid var(--line);padding-block:22px}
.day .when{display:flex;flex-direction:column;gap:4px}
.day .when b{font:700 30px/1 var(--font-display);letter-spacing:-.02em}
.day .notes{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:20px 28px}
.day .story{border-top:0;padding-block:0}
.day .story h3{font-size:20px}
.none{color:var(--muted);padding-block:40px}
footer{border-top:1px solid var(--line);padding-block:28px;color:var(--muted)}
footer .wrap{display:flex;flex-wrap:wrap;gap:12px 24px;justify-content:space-between}
@media (max-width:820px){

<footer><div class="wrap"><span class="k">Blewprint · El plano del día, cada mañana</span><span class="k" id="updated"></span></div></footer>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const MONTHS = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const DAYS = ['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
const longDate = iso => { const [y,m,d] = iso.split('-').map(Number); const dt = new Date(Date.UTC(y,m-1,d)); return `${DAYS[dt.getUTCDay()]} ${d} de ${MONTHS[m-1]} de ${y}`; };
const section = n => (n.kicker || 'General').split('·')[0].trim();
let data = { ediciones: [] }, filter = 'Todo', q = '';

const src = n => n.url ? `<span class="src k mut">Fuente: <a href="${esc(n.url)}" target="_blank" rel="noopener">${esc(n.fuente || 'ver nota')}</a></span>` : (n.fuente ? `<span class="src k mut">Fuente: ${esc(n.fuente)}</span>` : '');
const match = n => (filter === 'Todo' || section(n) === filter) && (!q || (n.titular + ' ' + n.bajada + ' ' + (n.kicker||'')).toLowerCase().includes(q));

function render(){
  const eds = data.ediciones;
  if (!eds.length){ $('#hoy').innerHTML = '<p class="none">Todavía no hay ediciones publicadas.</p>'; return; }
  const [today, ...rest] = eds;
  $('#today-date').textContent = longDate(today.fecha);
  const tn = (today.notas || []).filter(match);
  const [lead, ...others] = tn;
  $('#hoy').innerHTML = `
    <div class="dayhd"><span class="pill"><i></i>Lo que sopló hoy</span><h2>${esc(longDate(today.fecha).replace(/^./, c=>c.toUpperCase()))}</h2></div>
    ${lead ? `<div class="grid">
      <article class="lead"><span class="k sec">${esc(lead.kicker)}</span><h3>${esc(lead.titular)}</h3><p class="dek">${esc(lead.bajada)}</p>
        ${lead.dato ? `<div class="dato"><span class="fig">${esc(lead.dato.cifra)}</span><span class="ctx">${esc(lead.dato.contexto)}</span></div>` : ''}${src(lead)}</article>
      <div class="side-stories">${others.map(n => `<article class="story"><span class="k sec">${esc(n.kicker)}</span><h3>${esc(n.titular)}</h3><p class="dek">${esc(n.bajada)}</p>${n.dato ? `<span class="fig">${esc(n.dato.cifra)}</span>` : ''}${src(n)}</article>`).join('')}
        ${today.radar?.length && filter === 'Todo' && !q ? `<div class="radar"><h4>También sopló</h4><ul>${today.radar.map(r => `<li><b>${esc(r.titular)}</b>${esc(r.detalle)}</li>`).join('')}</ul></div>` : ''}
      </div></div>` : '<p class="none">Ninguna nota de hoy coincide con el filtro.</p>'}`;
  const days = rest.map(e => ({ e, ns: (e.notas || []).filter(match) })).filter(x => x.ns.length);
  $('#archivo').innerHTML = rest.length ? `<h2>Ediciones anteriores</h2>` + (days.length ? days.map(({e, ns}) => {
      const [y,m,d] = e.fecha.split('-').map(Number);
      return `<div class="day"><div class="when"><b>${d} ${MONTHS[m-1].slice(0,3)}</b><span class="k mut">${DAYS[new Date(Date.UTC(y,m-1,d)).getUTCDay()]} · ${y}</span></div>
      <div class="notes">${ns.map(n => `<article class="story"><span class="k sec">${esc(n.kicker)}</span><h3>${esc(n.titular)}</h3><p class="dek">${esc(n.bajada)}</p>${src(n)}</article>`).join('')}</div></div>`; }).join('')
    : '<p class="none">Ninguna nota anterior coincide con la búsqueda.</p>') : '';
}

function chips(){
  const secs = ['Todo', ...new Set(data.ediciones.flatMap(e => (e.notas||[]).map(section)))];
  $('#chips').innerHTML = secs.map(s => `<button class="chip" aria-pressed="${s===filter}" data-s="${esc(s)}">${esc(s)}</button>`).join('');
}
$('#chips').addEventListener('click', e => { const b = e.target.closest('.chip'); if (!b) return; filter = b.dataset.s; chips(); render(); });
$('#q').addEventListener('input', e => { q = e.target.value.trim().toLowerCase(); render(); });

fetch('notas.json', { cache: 'no-store' }).then(r => { if (!r.ok) throw 0; return r.json(); }).then(j => {
  data = j; data.ediciones.sort((a,b) => b.fecha.localeCompare(a.fecha));
  if (j.actualizado) $('#updated').textContent = 'Actualizado: ' + j.actualizado;
  chips(); render();
}).catch(() => { $('#hoy').innerHTML = '<p class="none">No se pudieron cargar las noticias. Recarga la página en unos segundos.</p>'; });
</script>
